<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Forbidden - Access Denied</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
  /* Reset and Base Styles */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #f8fafc;
    color: #334155;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
}

/* Container Layout */
.error-container {
    text-align: center;
    max-width: 480px;
    width: 100%;
    background: #ffffff;
    padding: 40px 30px;
    border-radius: 12px;
    box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
}

/* Icon Design */
.lock-icon {
    width: 80px;
    height: 80px;
    background-color: #fee2e2;
    color: #ef4444;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px auto;
}

.lock-icon svg {
    width: 40px;
    height: 40px;
}

/* Typography */
.error-code {
    font-size: 72px;
    font-weight: 800;
    color: #1e293b;
    line-height: 1;
    margin-bottom: 8px;
}

.error-message {
    font-size: 24px;
    font-weight: 600;
    color: #475569;
    margin-bottom: 16px;
}

.error-description {
    font-size: 15px;
    color: #64748b;
    line-height: 1.6;
    margin-bottom: 32px;
}

/* Navigation Controls */
.action-buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
}

.btn {
    display: inline-block;
    padding: 12px 24px;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    border-radius: 6px;
    transition: all 0.2s ease;
}

.btn-primary {
    background-color: #3b82f6;
    color: #ffffff;
}

.btn-primary:hover {
    background-color: #2563eb;
}

.btn-secondary {
    background-color: #f1f5f9;
    color: #475569;
}

.btn-secondary:hover {
    background-color: #e2e8f0;
}

/* Mobile Responsiveness */
@media (max-width: 480px) {
    .error-container {
        padding: 32px 20px;
    }
    .action-buttons {
        flex-direction: column;
    }
    .btn {
        width: 100%;
    }
}

</style>
<body>
    <div class="error-container">
        <div class="lock-icon">
            <!-- Inline SVG lock icon -->
            <svg xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>
        <h1 class="error-code">403</h1>
        <h2 class="error-message">Access Forbidden</h2>
        <p class="error-description">
            You do not have permission to retrieve this resource or directory. 
            Please check your URL or verify your security privileges.
        </p>
        <div class="action-buttons">
            <a href="/" class="btn btn-primary">Go to Home</a>
            <a href="javascript:history.back()" class="btn btn-secondary">Go Back</a>
        </div>
    </div>
</body>
</html>
